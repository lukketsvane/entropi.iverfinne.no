<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TripoSplat preview</title>
		<style>
			* { box-sizing: border-box; }
			html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d09; color: #d4e4d0; font: 12px system-ui, sans-serif; }
			canvas { display: block; }
			#message { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: #080d09; }
			#hint { position: absolute; left: 12px; bottom: 10px; color: #e2f2dc; text-shadow: 0 1px 5px #000; pointer-events: none; }
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
					"@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.0.0/dist/spark.module.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="message">Loading 3D preview…</div>
		<div id="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
		<script type="module">
			const message = document.getElementById('message');
			const id = new URLSearchParams(location.search).get('job');

			async function start() {
				if (!id || !/^[A-Za-z0-9_-]{8,128}$/.test(id)) throw new Error('Invalid job ID.');
				const [THREE, { OrbitControls }, { SparkRenderer, SplatMesh, SplatFileType }] = await Promise.all([
					import('three'),
					import('three/addons/controls/OrbitControls.js'),
					import('@sparkjsdev/spark')
				]);
				const scene = new THREE.Scene();
				const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
				camera.position.set(0, 0.3, 1.8);
				const renderer = new THREE.WebGLRenderer({ antialias: false });
				renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
				renderer.setSize(innerWidth, innerHeight);
				document.body.appendChild(renderer.domElement);
				scene.add(new SparkRenderer({ renderer }));
				const controls = new OrbitControls(camera, renderer.domElement);
				controls.enableDamping = true;
				controls.minDistance = 0.2;
				controls.maxDistance = 50;
				const splat = new SplatMesh({
					url: `/triposplat/api/jobs/${encodeURIComponent(id)}/artifact`,
					fileType: SplatFileType.SPLAT
				});
				const root = new THREE.Group();
				splat.rotation.y = Math.PI / 2;
				root.rotation.x = Math.PI;
				root.add(splat);
				scene.add(root);
				await splat.initialized;
				const box = new THREE.Box3().setFromObject(root);
				if (!box.isEmpty()) {
					const center = box.getCenter(new THREE.Vector3());
					const size = box.getSize(new THREE.Vector3());
					const distance = Math.max(size.x, size.y, size.z) * 2;
					controls.target.copy(center);
					camera.position.copy(center).add(new THREE.Vector3(0, distance * 0.15, Math.max(1.8, distance)));
					controls.update();
				}
				message.remove();
				addEventListener('resize', () => {
					camera.aspect = innerWidth / innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize(innerWidth, innerHeight);
				});
				renderer.setAnimationLoop(() => {
					controls.update();
					renderer.render(scene, camera);
				});
			}

			start().catch((error) => {
				message.textContent = error instanceof Error ? error.message : 'Could not load the 3D preview.';
			});
		</script>
	</body>
</html>
