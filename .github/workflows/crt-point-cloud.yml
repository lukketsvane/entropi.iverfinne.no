name: CRT point cloud quality
on:
  push:
    branches: [design/fine-crt-phosphor-points]
  pull_request:
    paths:
      - 'src/lib/pointcloud/**'
      - 'src/routes/+page.svelte'
      - 'tests/**'
      - '.github/workflows/crt-point-cloud.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
