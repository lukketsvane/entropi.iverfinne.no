name: Entropi 3D point cloud
on:
  push:
    branches: [feature/triposplat-point-cloud-camera]
  pull_request:
    paths:
      - 'src/**'
      - 'static/triposplat*'
      - 'tests/**'
      - '.github/workflows/entropi-point-cloud.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run check
      - run: npm run build
