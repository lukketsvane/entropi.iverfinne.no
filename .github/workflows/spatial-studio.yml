name: Spatial studio quality
on:
  push:
    branches: [design/immersive-point-cloud-studio]
  pull_request:
    paths:
      - 'src/**'
      - 'static/pointcloud/**'
      - 'tests/**'
      - '.github/workflows/spatial-studio.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
