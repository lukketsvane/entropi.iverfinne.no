<!doctype html>
<html lang="nn" style="background:#000;color-scheme:dark">

		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<meta name="description" content="Kamera som måler uorden." />

		<!-- iOS: heimskjerm-app utan nettlesarramme -->
		<meta name="apple-mobile-web-app-capable" content="yes" />

		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<link rel="preload" href="/fonts/michroma-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

	<body data-sveltekit-preload-data="false">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
